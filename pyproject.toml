[project]
name = "def-gen"
dynamic = ["version"]
description = "Generating and evaluating dictionary definitions with LLMs"
authors = [
    {name = "Bram Vanroy", email = "2779410+BramVanroy@users.noreply.github.com"},
]
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "choix>=0.4.1,<0.5",
    "datasets>=5.2,<6",
    "krippendorff>=0.9,<0.10",
    "llm-annotator>=0.19,<0.20",
    "lxml>=6.1.3,<7",
    "numpy>=2.3,<3",
    "openpyxl>=3.1.5,<4",
    "pydantic>=2.14,<3",
    "statsmodels>=0.15,<0.16",
    "tqdm>=4.70,<5",
]

[project.optional-dependencies]
vllm = ["llm-annotator[vllm]"]
anthropic = ["llm-annotator[anthropic]"]
openai = ["llm-annotator[openai]"]

[project.urls]
Homepage = "https://github.com/BramVanroy/def-gen"
Repository = "https://github.com/BramVanroy/def-gen"
Issues = "https://github.com/BramVanroy/def-gen/issues"
Changelog = "https://github.com/BramVanroy/def-gen/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/def_gen"]

[dependency-groups]
dev = [
    "pre-commit>=4.7,<5",
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17.1,<0.18",
]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests", "src"]
addopts = ["--doctest-modules", "--import-mode=importlib"]
strict = true

[tool.coverage.run]
source_pkgs = ["def_gen"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # Ruff-native rules
    "D",   # pydocstyle
]
# E501: line length is handled by `ruff format`; long strings/URLs are fine.
# D105, D107: magic methods and __init__ are documented on the class.
ignore = ["E501", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["def_gen"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]

[tool.ruff.format]
docstring-code-format = true
