[project]
name = "def-gen"
dynamic = ["version"]
description = "Generating and evaluating dictionary definitions with LLMs"
readme = "README.md"
authors = [
    { name = "Bram Vanroy", email = "2779410+BramVanroy@users.noreply.github.com" }
]
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.12"
dependencies = [
    "choix>=0.4.1",
    "datasets>=4.4.1",
    "krippendorff>=0.8.1",
    "llm-annotator==0.10.6",
    "lxml>=6.0.2,<7",
    "numpy>=2.2.6",
    "openpyxl>=3.1.5",
    "pydantic>=2.11.9,<3",
    "pingouin>=0.5.5,<0.6",
    "statsmodels>=0.14.5",
    "tqdm",
]

[project.optional-dependencies]
vllm = [
    "llm-annotator[vllm]==0.10.6"
]
anthropic = [
    "llm-annotator[anthropic]==0.10.6"
]
openai = [
    "llm-annotator[openai]==0.10.6"
]

[project.urls]
Homepage = "https://github.com/BramVanroy/def-gen"
Documentation = "https://BramVanroy.github.io/def-gen"
Repository = "https://github.com/BramVanroy/def-gen"
Issues = "https://github.com/BramVanroy/def-gen/issues"
Changelog = "https://github.com/BramVanroy/def-gen/releases"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/def_gen"]

[dependency-groups]
docs = [
    "mkdocs-material>=9.7.6,<10",
    "mike>=2.1.3,<3",
    "mkdocstrings[python]>=1.0.4,<2",
    "mkdocs-autorefs>=1.4.4,<2",
    "mkdocs-gen-files>=0.6.1,<1",
    "mkdocs-minify-plugin>=0.8.0,<1",
]
dev = [
    {include-group = "docs"},
    "interrogate>=1.7.0,<2",
    "mypy>=1.20.1,<2",
    "pre-commit>=4.6.0,<5",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.10,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = [
    "--doctest-modules",
    "--import-mode=importlib",
    "--cov=def_gen",
    "--cov-report=term-missing",
    "--cov-report=xml",
]

[tool.ruff]
target-version = "py312"
line-length = 79

[tool.ruff.lint]
ignore = ["C901", "E501", "E741", "F402", "F823", "E402"]
select = ["C", "E", "F", "W", "I"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["def_gen"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.interrogate]
style = "google"
exclude = ["tests", "scratches"]
ignore-private = true
ignore-semiprivate = true
color = true

[tool.mypy]
python_version = "3.12"
files = ["scripts", "src", "tests"]
pretty = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
