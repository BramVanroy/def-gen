version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      # One group for all packages: every update touches uv.lock, so separate
      # PRs would conflict with each other after the first merge.
      uv:
        patterns: ["*"]
    ignore:
      # vLLM (through numba and mistral-common) caps numpy below 2.4 on
      # Python 3.12. Remove this once the vllm extra allows a newer numpy.
      - dependency-name: numpy
        versions: [">=2.4"]
